name: XP legacy candidate

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - ".github/workflows/xp-legacy-candidate.yml"
      - "legacy/xp_host/**"
      - "scripts/make_windows_xp_legacy.ps1"
      - "scripts/find_windows_signtool.ps1"
      - "scripts/check_xp_candidate_build_inputs.py"
      - "scripts/check_xp_candidate_run.py"
      - "scripts/check_platform_promotion_artifacts.py"
      - "scripts/check_windows_xp_legacy_candidate_workflow.py"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/xp-legacy-candidate.yml"
      - "legacy/xp_host/**"
      - "scripts/make_windows_xp_legacy.ps1"
      - "scripts/find_windows_signtool.ps1"
      - "scripts/check_xp_candidate_build_inputs.py"
      - "scripts/check_xp_candidate_run.py"
      - "scripts/check_platform_promotion_artifacts.py"
      - "scripts/check_windows_xp_legacy_candidate_workflow.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Windows XP legacy candidate (${{ matrix.arch }})
    if: ${{ github.ref_type != 'tag' }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    strategy: &xp_matrix
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps: &xp_steps
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Require trusted XP release source
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "push" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF" = "refs/tags/$GITHUB_REF_NAME"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin "${GITHUB_REF}:refs/tags/row-xp-release"
          test "$GITHUB_SHA" = "$(git rev-parse 'refs/tags/row-xp-release^{commit}')"
          git check-ref-format --branch "$DEFAULT_BRANCH" >/dev/null
          git fetch --no-tags origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"
      - name: Build Windows XP legacy candidate
        shell: pwsh
        env:
          ROW_XP_REQUIRE_SIGNING: ${{ github.ref_type == 'tag' && '1' || '0' }}
          ROW_WINDOWS_CERTIFICATE_BASE64: ${{ github.ref_type == 'tag' && secrets.ROW_WINDOWS_CERTIFICATE_BASE64 || '' }}
          ROW_WINDOWS_CERTIFICATE_PASSWORD: ${{ github.ref_type == 'tag' && secrets.ROW_WINDOWS_CERTIFICATE_PASSWORD || '' }}
          ROW_WINDOWS_TIMESTAMP_URL: ${{ github.ref_type == 'tag' && secrets.ROW_WINDOWS_TIMESTAMP_URL || '' }}
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:GITHUB_SHA) {
            throw "The XP build checkout does not match the workflow source SHA."
          }
          ./scripts/make_windows_xp_legacy.ps1 -Arch ${{ matrix.arch }}
      - name: Verify XP candidate build receipt
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          python scripts/check_xp_candidate_build_inputs.py `
            --receipt "build/native/windows-xp/$env:TARGET_ARCH/xp-build-inputs.json" `
            --assets-dir "native-dist/windows-xp/$env:TARGET_ARCH" `
            --arch "$env:TARGET_ARCH" --repository "$env:GITHUB_REPOSITORY" `
            --source-ref "$env:GITHUB_REF" --source-sha "$env:GITHUB_SHA" `
            --run-id "$env:GITHUB_RUN_ID" --run-attempt "$env:GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-xp-legacy-candidate-${{ matrix.arch }}-${{ github.run_attempt }}
          path: native-dist/windows-xp/${{ matrix.arch }}/*
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-xp-build-inputs-${{ matrix.arch }}-${{ github.run_attempt }}
          path: build/native/windows-xp/${{ matrix.arch }}/xp-build-inputs.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90
  build-signed:
    name: Windows XP signed candidate (${{ matrix.arch }})
    if: ${{ github.ref_type == 'tag' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    environment: release
    strategy: *xp_matrix
    steps: *xp_steps
