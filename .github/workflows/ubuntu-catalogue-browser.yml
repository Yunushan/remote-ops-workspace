          BOOTSTRAP_PHASES = ('bootstrap', 'system-context', 'interpreter', 'runner-account', 'host-context', 'os-release', 'workspace', 'event', 'run-context', 'root-bases', 'source-checks', 'stage-birth', 'stage-write', 'stage-seal', 'stage-readback', 'stage-cleanup', 'exec')


          class BootstrapRefusal(RuntimeError):
              pass


          def need(value, code='check-refused'):
              if not value:
                  raise BootstrapRefusal(code)


          def bootstrap_diagnostic(error, phase):
