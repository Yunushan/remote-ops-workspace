name: Prepare Debian amd64 MobApt cache

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Target production release tag (vX.Y.Z)
        required: true
        type: string
      bash_version:
        description: Exact Debian binary package version of bash
        required: true
        type: string
      tree_version:
        description: Exact Debian binary package version of tree
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare-cache:
    if: github.repository == 'Yunushan/remote-ops-workspace' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      BASH_PACKAGE_VERSION: ${{ inputs.bash_version }}
      TREE_PACKAGE_VERSION: ${{ inputs.tree_version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assemble cache from authenticated Debian packages
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version_pattern='^[0-9][0-9A-Za-z.+:~_-]*$'
          [[ "$BASH_PACKAGE_VERSION" =~ $version_pattern && "$TREE_PACKAGE_VERSION" =~ $version_pattern ]]
          output="$RUNNER_TEMP/debian-mobapt-assembly"
          mkdir "$output"
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src,readonly" \
            --mount "type=bind,source=$output,target=/out" \
            --env RELEASE_TAG --env BASH_PACKAGE_VERSION --env TREE_PACKAGE_VERSION --env PYTHONDONTWRITEBYTECODE=1 \
            docker.io/library/python:3.14.10-slim-trixie@sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f \
            bash -euo pipefail -c '
              apt-get update
              downloads="$(mktemp -d)"
              chown _apt "$downloads"
              cd "$downloads"
              apt-get download "bash=$BASH_PACKAGE_VERSION" "tree=$TREE_PACKAGE_VERSION"
              bash_debs=(bash_*_amd64.deb)
              tree_debs=(tree_*_amd64.deb)
              [[ "${#bash_debs[@]}" = 1 && -f "${bash_debs[0]}" && "${#tree_debs[@]}" = 1 && -f "${tree_debs[0]}" ]]
              test "$(dpkg-deb --field "${bash_debs[0]}" Version)" = "$BASH_PACKAGE_VERSION"
              test "$(dpkg-deb --field "${tree_debs[0]}" Version)" = "$TREE_PACKAGE_VERSION"
              python -B /src/scripts/prepare_debian_mobapt_cache.py --tag "$RELEASE_TAG" \
                --bash-deb "${bash_debs[0]}" --tree-deb "${tree_debs[0]}" --out /out/cache
              chmod -R a+rX /out/cache
            '
      - name: Retain the candidate cache for review
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: debian-amd64-mobapt-cache-${{ inputs.release_tag }}
          path: ${{ runner.temp }}/debian-mobapt-assembly/cache/
          if-no-files-found: error
          retention-days: 90
      - name: Report the candidate release selection
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          checksum="$(sha256sum "$RUNNER_TEMP/debian-mobapt-assembly/cache/mobapt-debian-review.json")"
          printf 'Cache candidate for review before setting `ROW_DEBIAN_AMD64_MOBAPT_BUNDLE`\n\n`%s %s %s %s`\n' \
            "$RELEASE_TAG" "$GITHUB_RUN_ID" "$ARTIFACT_ID" "${checksum%% *}" >> "$GITHUB_STEP_SUMMARY"
