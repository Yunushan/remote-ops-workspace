              need(os.getuid() == os.geteuid() == 0 and os.getgid() == os.getegid() == 0 and sys.flags.isolated == 1
                  and sys.flags.no_site == 1 and sys.dont_write_bytecode, 'root-isolated-startup')
              phase = 'interpreter'
              python = Path(sys.executable).resolve(strict=True)
              need(python == Path('/usr/bin/python3.12'), 'system-interpreter-path')
              need(raw_read(python, 536870912, {0})[:4] == b'\x7fELF', 'system-interpreter-elf')
              phase = 'runner-account'
              account = pwd.getpwnam('runner')
              need(account.pw_name == 'runner' and account.pw_uid > 0 and account.pw_gid > 0
                  and account.pw_dir == '/home/runner', 'runner-account')
              phase = 'host-context'
              env = os.environ
              need(env.get('GITHUB_ACTIONS') == 'true' and env.get('RUNNER_ENVIRONMENT') == 'github-hosted'
                  and env.get('GITHUB_REPOSITORY') == 'Yunushan/remote-ops-workspace'
                  and env.get('ImageOS') == 'ubuntu24' and re.fullmatch(r'[0-9.]{1,64}', env.get('ImageVersion', '')), 'host-image-context')
              phase = 'os-release'
              release = raw_read(Path('/etc/os-release').resolve(strict=True), 4096, {0})
              need(re.search(rb'^ID=ubuntu$', release, re.MULTILINE)
                  and re.search(rb'^VERSION_ID="24\.04"$', release, re.MULTILINE), 'os-release-context')
              phase = 'workspace'
              repo = Path(env['GITHUB_WORKSPACE'])
              need(str(repo) == '/home/runner/work/remote-ops-workspace/remote-ops-workspace', 'workspace-path')
              for directory in (repo, repo / 'tests', repo / 'tests' / 'catalogue-browser'):
                  info = directory.lstat()
                  need(stat.S_ISDIR(info.st_mode) and info.st_uid == account.pw_uid
                      and info.st_gid == account.pw_gid and not info.st_mode & 0o022, 'workspace-directory-policy')
              for directory in repo.parents:
                  need(stat.S_ISDIR(directory.lstat().st_mode), 'workspace-ancestor-directory')
              source, event_sha = env.get('QUALIFICATION_SOURCE_SHA', ''), env.get('GITHUB_SHA', '')
              need(re.fullmatch(r'[0-9a-f]{40}', source) and re.fullmatch(r'[0-9a-f]{40}', event_sha), 'source-head-format')
              phase = 'event'
              event = json_data(raw_read(Path(env['GITHUB_EVENT_PATH']), 1048576, {0, account.pw_uid}))
              need(event['repository']['full_name'] == 'Yunushan/remote-ops-workspace'
                  and event['repository']['private'] is False, 'event-repository')
              if env.get('GITHUB_EVENT_NAME') == 'pull_request':
                  pr = event['pull_request']
                  need(pr['head']['repo']['full_name'] == 'Yunushan/remote-ops-workspace'
                      and pr['head']['sha'] == source and pr['base']['ref'] == 'main'
                      and event['action'] in ('opened', 'reopened', 'synchronize'), 'event-pull-request')
              else:
                  need(env.get('GITHUB_EVENT_NAME') == 'push' and event['ref'] == 'refs/heads/main'
                      and event['after'] == source == event_sha, 'event-push')
              phase = 'run-context'
              for key in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT'):
                  need(re.fullmatch(r'[1-9][0-9]{0,19}', env.get(key, '')), 'run-identifiers')
              workflow = '.github/workflows/ubuntu-catalogue-browser.yml'
              need(re.fullmatch(r'[0-9a-f]{40}', env.get('GITHUB_WORKFLOW_SHA', ''))
                  and env.get('GITHUB_WORKFLOW_REF', '').startswith('Yunushan/remote-ops-workspace/' + workflow + '@'), 'workflow-context')
              phase = 'root-bases'
              for directory in (Path('/'), Path('/var'), Path('/var/lib')):
                  info = directory.lstat()
                  need(stat.S_ISDIR(info.st_mode) and info.st_uid == 0 and not info.st_mode & 0o022, 'root-base-policy')
              return repo, account.pw_uid


          def write_source(path, raw):
              clock()
              fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
              try:
                  remaining = memoryview(raw)
                  while remaining:
                      clock()
                      count = os.write(fd, remaining)
                      need(count > 0, 'write-progress')
                      remaining = remaining[count:]
                  os.fsync(fd)
                  os.fchmod(fd, 0o444)
              finally:
                  os.close(fd)
              need(raw_read(path, 1048576, {0}) == raw, 'stage-byte-readback')


          def main():
              global phase
              repo, uid = validate_context()
              directory = repo / 'tests' / 'catalogue-browser'
              phase = 'source-checks'
              source = {}
              for name, pin in PINS.items():
                  need(re.fullmatch(r'[a-z_-]+\.(?:py|json)', name) and set(pin) == {'bytes', 'sha256'}, 'source-recipe-shape')
                  data = raw_read(directory / name, 1048576, {uid})
                  need(len(data) == pin['bytes'] and hashlib.sha256(data).hexdigest() == pin['sha256'], 'source-bytes-pin')
                  source[name] = data
              root = Path('/var/lib') / ('row-cft-source-' + secrets.token_hex(16))
              phase = 'stage-birth'
              parent_fd = None
              stage_fd = None
              try:
                  parent_fd = os.open('/var/lib', os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
                  parent_before = Path('/var/lib').lstat()
                  need(identity(os.fstat(parent_fd)) == identity(parent_before), 'stage-parent-descriptor')
                  os.mkdir(root.name, mode=0o700, dir_fd=parent_fd)
                  stage_fd = os.open(root.name, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=parent_fd)
                  need(identity(os.fstat(stage_fd)) == identity(root.lstat()), 'stage-child-descriptor')
                  phase = 'stage-write'
                  for name, data in source.items():
                      write_source(root / name, data)
                  capsule = json.dumps({'source_directory': str(directory), 'pins': PINS},
                      sort_keys=True, separators=(',', ':'), ensure_ascii=True).encode('ascii')
                  write_source(root / 'stage.json', capsule)
                  phase = 'stage-seal'
                  os.fchmod(stage_fd, 0o555)
                  need(identity(os.fstat(stage_fd)) == identity(root.lstat()), 'stage-seal-identity')
                  phase = 'stage-readback'
                  current_parent = Path('/var/lib').lstat()
                  need(current_parent.st_uid == 0 and not current_parent.st_mode & 0o022
                      and (current_parent.st_dev, current_parent.st_ino) == (parent_before.st_dev, parent_before.st_ino), 'stage-parent-readback')
              finally:
                  first = None
                  for fd in (stage_fd, parent_fd):
                      if fd is not None:
                          try:
                              os.close(fd)
                          except BaseException as error:
                              if first is None:
                                  phase = 'stage-cleanup'
                                  first = error
                  if first is not None:
                      raise first
              clock()
              env = dict(os.environ)
              env['ROW_CFT_PREP_DEADLINE'] = repr(deadline)
              # The only inserted import directory is the exact root-staged pinned tree.
              loader = 'import runpy,sys;sys.path.insert(0,' + repr(str(root)) + ');runpy.run_path(' + repr(str(root / 'cft_runtime.py')) + ',run_name="__main__")'
              phase = 'exec'
              os.execve('/usr/bin/python3.12', ['/usr/bin/python3.12', '-I', '-S', '-B', '-c', loader], env)


          try:
              main()
          except BaseException as error:
              emit_bootstrap_diagnostic(error, phase, sys.stderr)
              try:
                  sys.stderr.write('cft-root-bootstrap-refused\n')
              except BaseException:
                  pass
              raise SystemExit(1) from None
          ROW_CFT_CLEANUP_ROOT_PY
      - name: Validate the sole public receipt
        id: public-receipt
        if: always()
        shell: bash
        env:
          ROW_CFT_CLEANUP_OUTCOME: ${{ steps.host-policy-cleanup.outcome }}
        run: |
          python -I -S -B - <<'ROW_CFT_POLICY_PUBLISH'
          import sys
          from pathlib import Path
          try:
              sys.path.insert(0, str(Path('tests/catalogue-browser').resolve(strict=True)))
              from host_controller import bind_host_policy_cleanup
              bind_host_policy_cleanup()
          except BaseException:
              try:
                  sys.stderr.write('cft-host-policy-publication-refused\n')
                  sys.stderr.flush()
              except BaseException:
                  pass
              raise SystemExit(1) from None
          ROW_CFT_POLICY_PUBLISH
          python -I -S -B tests/catalogue-browser/entry.py publish
      - name: Save bounded public receipt only
        if: always() && steps.public-receipt.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ubuntu-actual-catalogue-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/catalogue-browser-upload/result.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
