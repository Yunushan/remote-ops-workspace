                      data.extend(chunk)
                  need(len(data) == before.st_size and identity(os.fstat(fd)) == identity(before), 'descriptor-after-length')
                  answer = bytes(data)
              finally:
                  os.close(fd)
              need(identity(path.lstat()) == identity(before), 'input-path-readback')
              clock()
              return answer


          def unique(rows):
              answer = {}
              for key, value in rows:
                  need(key not in answer, 'json-duplicate-key')
                  answer[key] = value
              return answer


