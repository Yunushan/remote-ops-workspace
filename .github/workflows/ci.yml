name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  repo-policy:
    name: Repository policy and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Qt headless runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Install policy verification dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Dependency vulnerability audit
        run: >-
          python -c "import truststore; truststore.inject_into_ssl(); from pip_audit._cli import audit; audit()"
          --strict --no-deps --disable-pip -r requirements-release.txt
      - name: Verify repository policy
        run: python scripts/verify.py --quick
      - name: Ruff lint
        run: python -m ruff check src tests scripts
      - name: Cross-platform GUI type safety
        run: |
          python -m mypy src/remote_ops_workspace/gui.py --platform linux --no-incremental --no-pretty --show-error-codes
          python -m mypy src/remote_ops_workspace/gui.py --platform win32 --no-incremental --no-pretty --show-error-codes
          python -m mypy src/remote_ops_workspace/gui.py --platform darwin --no-incremental --no-pretty --show-error-codes
      - name: Non-GUI production type gate
        run: python scripts/check_non_gui_types.py

  coverage:
    name: Python branch-aware coverage
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      # Keep instrumentation deterministic: the native Windows Qt event loop is
      # exercised by the separate blocking GUI job without coverage overhead.
      QT_QPA_PLATFORM: "offscreen"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install coverage verification dependencies
        run: python -m pip install -e ".[desktop,security,dev]"
      - name: Create coverage evidence directory
        run: New-Item -ItemType Directory -Force -Path artifacts/coverage | Out-Null
      - name: Enforce branch coverage floor
        run: >-
          python -m pytest -q
          --cov=remote_ops_workspace
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:artifacts/coverage/coverage.xml
          --cov-report=json:artifacts/coverage/coverage.json
          --cov-fail-under=77.7
      - name: Validate aggregate and branch coverage evidence
        run: >-
          python scripts/check_coverage_report.py
          --report artifacts/coverage/coverage.json
          --min-total 77.7
          --min-branches 63.0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: python-branch-aware-coverage
          path: artifacts/coverage/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025-vs2026, macos-15-intel]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: macos-26-intel
            python-version: "3.12"
          - os: macos-26-intel
            python-version: "3.13"
          - os: macos-26-intel
            python-version: "3.14"
          - os: macos-26-intel
            python-version: "3.15"
          - os: macos-14
            python-version: "3.12"
          - os: macos-14
            python-version: "3.13"
          - os: macos-14
            python-version: "3.14"
          - os: macos-14
            python-version: "3.15"
          - os: macos-15
            python-version: "3.12"
          - os: macos-15
            python-version: "3.13"
          - os: macos-15
            python-version: "3.14"
          - os: macos-15
            python-version: "3.15"
          - os: macos-26
            python-version: "3.12"
          - os: macos-26
            python-version: "3.13"
          - os: macos-26
            python-version: "3.14"
          - os: macos-26
            python-version: "3.15"
          - os: ubuntu-24.04-arm
            python-version: "3.15"
          - os: windows-11-arm
            python-version: "3.15"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          # Python 3.15 is release-candidate software until its upstream GA.
          # Keep it blocking in the normal matrix rather than hiding it in an
          # advisory job; stable matrix rows still resolve stable interpreters.
          allow-prereleases: true
      - name: Purge pip cache
        run: python -m pip cache purge
        continue-on-error: true
      - name: Prepare pinned Windows ARM64 security source build
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: powershell
        run: .\scripts\install_windows_arm64_security.ps1
      - name: Build maintained Intel macOS security dependencies
        if: runner.os == 'macOS' && runner.arch == 'X64'
        env:
          PIP_NO_CACHE_DIR: "1"
        run: |
          python -m pip install --constraint requirements-release.txt pip setuptools wheel maturin cffi pycparser
          python -m pip install --no-cache-dir --no-build-isolation --no-binary=cryptography --constraint requirements-release.txt -e ".[security,dev]"
      - name: Install
        if: runner.os != 'macOS' || runner.arch != 'X64'
        env:
          PIP_NO_CACHE_DIR: "1"
        run: |
          python -m pip install -e ".[security,dev]"
      - name: Pytest
        run: python -m pytest -q

  python315-optional-dependencies:
    name: Python 3.15 optional dependencies, GUI, and build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      QT_QPA_PLATFORM: "offscreen"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-2025-vs2026, windows-11-arm, macos-15-intel, macos-15]
        include:
          - os: ubuntu-latest
            qt_platform: "offscreen"
          - os: ubuntu-24.04-arm
            qt_platform: "offscreen"
          - os: windows-2025-vs2026
            qt_platform: "windows"
          - os: windows-11-arm
            qt_platform: "windows"
          - os: macos-15-intel
            # Hosted macOS is not guaranteed to expose a logged-in WindowServer.
            # Keep the full application render deterministic and headless there.
            qt_platform: "offscreen"
          - os: macos-15
            # Hosted macOS is not guaranteed to expose a logged-in WindowServer.
            # Keep the full application render deterministic and headless there.
            qt_platform: "offscreen"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fontconfig \
            fonts-dejavu-core \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0
      - name: Prepare pinned Windows ARM64 security source build
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: powershell
        run: .\scripts\install_windows_arm64_security.ps1
      - name: Install complete Python 3.15 verification environment
        run: python -m pip install -e ".[desktop,security,package,dev]"
      - name: Install Python 3.15 native Windows SSH evidence dependency
        if: runner.os == 'Windows'
        run: python -m pip install "paramiko==5.0.0"
      - name: Verify complete Python 3.15 dependency environment
        run: |
          python -m pip check
          python scripts/check_optional_dependencies.py --require-extra desktop --require-extra security --require-extra package --require-extra dev
          python -m PyInstaller --version
      - name: Build and launch a real Python 3.15 frozen CLI executable
        timeout-minutes: 15
        run: >-
          python scripts/check_python_frozen_executable.py --expected-python 3.15
          --out-dir artifacts/python315-frozen --timeout-seconds 720
      - name: Record exact Python 3.15 runtime evidence
        run: >-
          python scripts/write_python_runtime_evidence.py --expected-version 3.15
          --require-standard-gil --out artifacts/python315-runtime/runtime.json
      - name: Verify Python 3.15 offscreen QtWidgets application startup
        run: >-
          python -c "import sys; assert sys.version_info[:2] == (3, 15), sys.version;
          import bcrypt, cryptography, truststore; from PyQt6.QtCore import QT_VERSION_STR;
          from PyQt6.QtWidgets import QApplication, QLabel; app = QApplication([]);
          label = QLabel('Python 3.15 QtWidgets smoke'); label.resize(320, 80);
          label.show(); app.processEvents(); assert label.isVisible();
          assert not label.grab().isNull(); label.close(); app.processEvents();
          print(sys.version); print('Qt', QT_VERSION_STR)"
      - name: Run the complete test suite with Python 3.15 optional dependencies
        timeout-minutes: 15
        run: python -m pytest -q
      - name: Run Python 3.15 native Windows SSH and ConPTY evidence
        if: runner.os == 'Windows'
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: "windows"
          ROW_REQUIRE_WINDOWS_SSH_LOOPBACK: "1"
          ROW_WINDOWS_SSH_EVIDENCE_DIR: artifacts/python315-windows-ssh
        run: >-
          python -m pytest -q tests/test_windows_ssh_loopback.py
          --junitxml=artifacts/python315-windows-ssh/junit.xml
      - name: Render every real GUI preset on Python 3.15
        timeout-minutes: 8
        env:
          QT_QPA_PLATFORM: ${{ matrix.qt_platform }}
        run: >-
          python scripts/check_real_gui_render.py --out-dir artifacts/python315-gui
          --require-pyqt6 --timeout-seconds 300
      - name: Exercise every GUI preset interaction on Python 3.15
        timeout-minutes: 8
        env:
          QT_QPA_PLATFORM: ${{ matrix.qt_platform }}
        run: >-
          python scripts/check_gui_interactions.py --require-pyqt6
          --out-dir artifacts/python315-interactions
      - name: Build Python 3.15 source and wheel distributions
        run: python -m build --sdist --wheel --outdir artifacts/python315-dist
      - name: Install and smoke Python 3.15 wheel and source distributions
        timeout-minutes: 10
        run: >-
          python scripts/check_python_distribution_install.py
          --dist-dir artifacts/python315-dist
          --out artifacts/python315-runtime/distribution-install.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: python315-gui-${{ matrix.os }}
          path: artifacts/python315-gui
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: python315-interactions-${{ matrix.os }}
          path: artifacts/python315-interactions
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: python315-distributions-${{ matrix.os }}
          path: artifacts/python315-dist
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: python315-runtime-${{ matrix.os }}
          path: artifacts/python315-runtime
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: python315-frozen-${{ matrix.os }}
          path: artifacts/python315-frozen
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() && runner.os == 'Windows' }}
        with:
          name: python315-windows-ssh-${{ matrix.os }}
          path: artifacts/python315-windows-ssh
          if-no-files-found: error
          retention-days: 90

  python315-readiness:
    name: Python 3.15 readiness
    needs: [test, python315-optional-dependencies]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NORMAL_MATRIX_RESULT: ${{ needs.test.result }}
      OPTIONAL_MATRIX_RESULT: ${{ needs.python315-optional-dependencies.result }}
    steps:
      - name: Require Python 3.15 matrices to succeed
        shell: bash
        run: |
          test "$NORMAL_MATRIX_RESULT" = "success"
          test "$OPTIONAL_MATRIX_RESULT" = "success"

  mobile-web:
    name: Mobile Web/PWA contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install mobile web verification dependencies
        run: python -m pip install -e ".[dev]"
      - name: Android and iOS Web/PWA smoke
        run: python -m pytest tests/test_web_hardening.py tests/test_platform_targets.py tests/test_platform_support_truth.py tests/test_mobile_support.py

  web-container:
    name: Web/PWA container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Build and smoke-test Web/PWA container
        shell: bash
        run: |
          set -euo pipefail
          compose() { docker compose -p row-web-smoke -f docker/compose.yaml "$@"; }
          cleanup() { compose down --volumes --remove-orphans; }
          trap cleanup EXIT
          compose up --detach --build
          healthy=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8765/healthz; then
              healthy=true
              break
            fi
            sleep 1
          done
          if [[ "$healthy" != true ]]; then
            compose logs
            exit 1
          fi
          container_id="$(compose ps -q remote-ops-web)"
          test -n "$container_id"
          test "$(docker inspect --format '{{.Config.User}}' "$container_id")" = "10001:10001"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$container_id")" = "true"
          test "$(docker inspect --format '{{.HostConfig.PidsLimit}}' "$container_id")" = "128"
          docker inspect --format '{{.HostConfig.CapDrop}}' "$container_id" | grep -Fx "[ALL]"
          docker inspect --format '{{.HostConfig.SecurityOpt}}' "$container_id" | grep -Fx "[no-new-privileges:true]"
          compose exec -T remote-ops-web sh -c 'test -w /data && touch /data/.row-write-smoke && rm /data/.row-write-smoke'

  web-recovery:
    name: Web/PWA backup and restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Exercise destructive application-volume recovery
        shell: bash
        run: |
          set -euo pipefail
          workflow_run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          python scripts/run_web_recovery_drill.py \
            --compose-file docker/compose.yaml \
            --project-name row-web-recovery \
            --output artifacts/recovery/web-recovery-evidence.json \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$GITHUB_SHA" \
            --workflow-run-url "$workflow_run_url" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Validate retained recovery evidence
        shell: bash
        run: |
          set -euo pipefail
          workflow_run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          python scripts/check_web_recovery_evidence.py \
            --evidence artifacts/recovery/web-recovery-evidence.json \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$GITHUB_SHA" \
            --workflow-run-url "$workflow_run_url" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload sanitized recovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-recovery-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/recovery/web-recovery-evidence.json
          if-no-files-found: error
          retention-days: 30

  android-emulator-web:
    name: Android emulator Web/PWA response smoke API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 32, 33, 34, 35, 36]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install mobile verification dependencies
        run: python -m pip install -e ".[dev]"
      - name: Static mobile contract checks
        run: python -m pytest tests/test_web_hardening.py tests/test_mobile_support.py
      - name: Start Web/PWA server
        shell: bash
        run: |
          set -euo pipefail
          WEB_PWA_PORT="$(python - <<'PY'
          import socket

          with socket.socket() as sock:
              sock.bind(("127.0.0.1", 0))
              print(sock.getsockname()[1])
          PY
          )"
          WEB_PWA_URL="http://127.0.0.1:${WEB_PWA_PORT}/index.html"
          echo "WEB_PWA_PORT=$WEB_PWA_PORT" >> "$GITHUB_ENV"
          echo "WEB_PWA_URL=$WEB_PWA_URL" >> "$GITHUB_ENV"
          python -m http.server "$WEB_PWA_PORT" --directory apps/web --bind 127.0.0.1 > web-server.log 2>&1 &
          echo $! > web-server.pid
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Configure Android SDK command-line tools
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdk_tools="$sdk_root/cmdline-tools/latest/bin"
          if [[ ! -x "$sdk_tools/sdkmanager" || ! -x "$sdk_tools/avdmanager" ]]; then
            echo "::error::Android SDK command-line tools not found under $sdk_tools"
            find "$sdk_root" -maxdepth 4 -type f \( -name sdkmanager -o -name avdmanager \) -print || true
            exit 1
          fi
          avd_home="${RUNNER_TEMP:-$HOME}/android-avd"
          mkdir -p "$avd_home"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$avd_home" >> "$GITHUB_ENV"
          echo "$sdk_tools" >> "$GITHUB_PATH"
          echo "$sdk_root/emulator" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          "$sdk_tools/sdkmanager" --version
      - name: Install Android emulator image
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            "platform-tools"
            "emulator"
            "platforms;android-${{ matrix.api-level }}"
            "system-images;android-${{ matrix.api-level }};google_apis;x86_64"
          )
          accept_sdk_licenses() {
            set +o pipefail
            yes | sdkmanager --licenses
            license_status=$?
            set -o pipefail
            return "$license_status"
          }
          for attempt in 1 2 3; do
            if accept_sdk_licenses && sdkmanager --install "${packages[@]}"; then
              exit 0
            fi
            if [[ "$attempt" == "3" ]]; then
              break
            fi
            echo "::warning::Android SDK package installation failed on attempt $attempt; removing transient cache and incomplete API ${{ matrix.api-level }} system image before retrying"
            rm -rf "${ANDROID_USER_HOME:-$HOME/.android}/cache" \
              "$ANDROID_HOME/system-images/android-${{ matrix.api-level }}/google_apis/x86_64"
            sleep "$((attempt * 10))"
          done
          echo "::error::Android SDK package installation failed after 3 attempts"
          exit 1
      - name: Create Android virtual device
        run: |
          set -euo pipefail
          echo no | avdmanager create avd -n row-api-${{ matrix.api-level }} -k "system-images;android-${{ matrix.api-level }};google_apis;x86_64" --device "pixel_6"
          avdmanager list avd
          if ! emulator -list-avds | grep -Fx "row-api-${{ matrix.api-level }}"; then
            echo "::error::Android AVD row-api-${{ matrix.api-level }} was not created under ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
            find "${ANDROID_AVD_HOME:-$HOME/.android/avd}" -maxdepth 2 -type f -print || true
            exit 1
          fi
      - name: Boot Android emulator
        timeout-minutes: 8
        run: |
          set -euo pipefail
          emulator -list-avds
          if ! emulator -list-avds | grep -Fx "row-api-${{ matrix.api-level }}"; then
            echo "::error::Android AVD row-api-${{ matrix.api-level }} missing before emulator boot; ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
            find "${ANDROID_AVD_HOME:-$HOME/.android/avd}" -maxdepth 2 -type f -print || true
            exit 1
          fi
          nohup emulator -avd row-api-${{ matrix.api-level }} -no-window -gpu swiftshader_indirect -no-snapshot -no-snapshot-load -no-snapshot-save -noaudio -no-boot-anim -camera-back none -no-metrics > emulator.log 2>&1 &
          emulator_pid=$!
          echo "$emulator_pid" > emulator.pid
          deadline=$((SECONDS + 180))
          until adb devices | awk 'NR > 1 && $2 == "device" { found = 1 } END { exit found ? 0 : 1 }'; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "::error::Android emulator process exited before adb connection"
              tail -200 emulator.log || true
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::Android emulator did not appear in adb devices within 180 seconds"
              adb devices -l || true
              tail -200 emulator.log || true
              exit 1
            fi
            sleep 5
          done
          if ! timeout 180 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == "1" ]]; do sleep 5; done'; then
            echo "::error::Android emulator did not complete boot within 180 seconds"
            adb devices -l || true
            adb shell getprop || true
            tail -200 emulator.log || true
            exit 1
          fi
          adb shell input keyevent 82 || true
      - name: Map emulator loopback to host Web/PWA
        run: |
          set -euo pipefail
          adb reverse "tcp:${WEB_PWA_PORT}" "tcp:${WEB_PWA_PORT}"
          adb reverse --list
          adb reverse --list | grep -F "tcp:${WEB_PWA_PORT} tcp:${WEB_PWA_PORT}"
      - name: Android emulator Web/PWA response smoke
        timeout-minutes: 2
        run: |
          if ! python scripts/check_mobile_emulator_smoke.py --platform android --android-api ${{ matrix.api-level }} --url "$WEB_PWA_URL" --out-dir artifacts/mobile; then
            adb reverse --list || true
            tail -200 web-server.log || true
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-web-pwa-api-${{ matrix.api-level }}
          path: artifacts/mobile
          if-no-files-found: error

  ios-simulator-web:
    name: iOS Web/PWA simulator
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install mobile verification dependencies
        run: python -m pip install -e ".[dev]"
      - name: Static mobile contract checks
        run: python -m pytest tests/test_web_hardening.py tests/test_mobile_support.py
      - name: Start Web/PWA server
        run: |
          WEB_PWA_PORT="$(python - <<'PY'
          import socket

          with socket.socket() as sock:
              sock.bind(("127.0.0.1", 0))
              print(sock.getsockname()[1])
          PY
          )"
          export WEB_PWA_URL="http://127.0.0.1:${WEB_PWA_PORT}/index.html"
          echo "WEB_PWA_URL=$WEB_PWA_URL" >> "$GITHUB_ENV"
          python -m http.server "$WEB_PWA_PORT" --directory apps/web --bind 127.0.0.1 > web-server.log 2>&1 &
          echo $! > web-server.pid
          python - <<'PY'
          import os
          import time
          from pathlib import Path
          import urllib.request

          deadline = time.monotonic() + 90
          last_error = ""
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(os.environ["WEB_PWA_URL"], timeout=3) as response:
                      if response.status < 500:
                          raise SystemExit(0)
                      last_error = f"HTTP {response.status}"
              except Exception as exc:
                  last_error = str(exc)
              time.sleep(1)
          try:
              log_tail = Path("web-server.log").read_text(encoding="utf-8", errors="replace")[-4000:]
          except OSError as exc:
              log_tail = f"<could not read web-server.log: {exc}>"
          raise SystemExit(
              "Web/PWA server did not become reachable before iOS simulator smoke: "
              f"{last_error}\nweb-server.log:\n{log_tail}"
          )
          PY
      - name: iOS Web/PWA simulator smoke
        run: python scripts/check_mobile_emulator_smoke.py --platform ios --url "$WEB_PWA_URL" --ios-open-url-attempts 3 --out-dir artifacts/mobile
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-web-pwa-simulator
          path: artifacts/mobile
          if-no-files-found: error

  gui-render:
    name: Real PyQt6 GUI render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      QT_QPA_PLATFORM: "offscreen"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fontconfig \
            fonts-dejavu-core \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxext6 \
            libxrender1
      - name: Verify Linux GUI font discovery
        run: |
          fc-cache -f
          fc-match "DejaVu Sans"
          fc-list : family | grep -q .
      - name: Install desktop verification dependencies
        run: python -m pip install -e ".[desktop,security,dev]"
      - name: Real GUI render smoke
        timeout-minutes: 8
        run: python scripts/check_real_gui_render.py --require-pyqt6 --timeout-seconds 240 --out-dir artifacts/gui-real
      - name: Validate real GUI render artifact
        timeout-minutes: 2
        run: python scripts/check_real_gui_render_artifact.py --artifact-dir artifacts/gui-real
      - name: Exercise GUI controls and responsive layouts
        timeout-minutes: 5
        run: python scripts/check_gui_interactions.py --require-pyqt6 --out-dir artifacts/gui-interactions
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gui-real-render
          path: artifacts/gui-real/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gui-interactions-linux-offscreen
          path: artifacts/gui-interactions/*
          if-no-files-found: error

  gui-interactions-windows:
    name: Native Windows PyQt6 render and interactions
    runs-on: windows-2025-vs2026
    timeout-minutes: 40
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      QT_QPA_PLATFORM: "windows"
      ROW_REQUIRE_WINDOWS_SSH_LOOPBACK: "1"
      ROW_WINDOWS_SSH_EVIDENCE_DIR: artifacts/windows-ssh-loopback
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install desktop verification dependencies
        run: python -m pip install -e ".[desktop,security,dev]"
      - name: Install pinned loopback SSH test server
        run: python -m pip install "paramiko==5.0.0"
      - name: Verify real Windows ConPTY terminal transport
        timeout-minutes: 5
        run: python -m pytest -q tests/test_windows_conpty.py tests/test_qt_terminal_process.py
      - name: Verify native Windows OpenSSH authentication through Qt ConPTY
        timeout-minutes: 5
        run: python -m pytest -q tests/test_windows_ssh_loopback.py --junitxml=artifacts/windows-ssh-loopback/junit.xml
      - name: Render full GUI on native Windows
        timeout-minutes: 8
        run: python scripts/check_real_gui_render.py --require-pyqt6 --timeout-seconds 240 --out-dir artifacts/gui-real-windows
      - name: Validate native Windows GUI render artifact
        timeout-minutes: 2
        run: python scripts/check_real_gui_render_artifact.py --artifact-dir artifacts/gui-real-windows
      - name: Exercise native Windows controls and responsive layouts
        timeout-minutes: 8
        run: python scripts/check_gui_interactions.py --require-pyqt6 --out-dir artifacts/gui-interactions-windows
      - name: Capture native Windows terminal tab-switch paint turns
        timeout-minutes: 3
        run: python scripts/check_windows_tab_switch_paint.py --require-native-windows --out-dir artifacts/gui-tab-switch-windows
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gui-real-render-windows
          path: artifacts/gui-real-windows/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gui-interactions-windows
          path: artifacts/gui-interactions-windows/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gui-tab-switch-paint-windows
          path: artifacts/gui-tab-switch-windows/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-ssh-loopback-conpty
          path: artifacts/windows-ssh-loopback/*
          if-no-files-found: error

  native-windows-readiness:
    name: Native Windows readiness
    needs: [gui-interactions-windows]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NATIVE_WINDOWS_RESULT: ${{ needs.gui-interactions-windows.result }}
    steps:
      - name: Require native Windows verification to succeed
        shell: bash
        run: |
          test "$NATIVE_WINDOWS_RESULT" = "success"
