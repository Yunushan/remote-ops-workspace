[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "row-demo-plugin"
version = "0.1.0"
description = "Remote Ops Workspace protocol plugin for demo."
readme = "README.md"
requires-python = ">=3.10,<3.16"
dependencies = ["remote-ops-workspace>=1.0.0"]

[project.entry-points."remote_ops_workspace.plugins"]
demo = "row_demo_plugin.plugin:Plugin"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
