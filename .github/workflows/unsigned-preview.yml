name: unsigned-preview

# This lane is deliberately isolated from release.yml.  It is useful for
# reviewing a branch before it has the verified commits and protected signing
# material required by the production release lane.  It never runs from main,
# never creates a v* tag, and never claims production trust.
on:
  push:
    branches:
      - preview
      - "preview/**"
  workflow_dispatch:
    inputs:
      preview_ref:
        description: "Preview branch to build (must be preview or preview/*)"
        required: true
        default: preview
        type: string

permissions:
  contents: read

concurrency:
  group: unsigned-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SOURCE_DATE_EPOCH: "1704067200"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PREVIEW_REF: ${{ inputs.preview_ref || github.ref_name }}
  PREVIEW_TAG: unsigned-preview-${{ github.run_id }}

jobs:
  guard:
    name: Guard preview-only source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source-sha: ${{ steps.pin-source.outputs.sha }}
    steps:
      - name: Reject production refs
        shell: bash
        run: |
          case "$PREVIEW_REF" in
            preview|preview/*) ;;
            *)
              echo "::error::Unsigned previews may only build the preview or preview/* branch; got $PREVIEW_REF"
              exit 1
              ;;
          esac
          if [[ "$PREVIEW_REF" == "main" || "$PREVIEW_REF" == refs/heads/main ]]; then
            echo "::error::The unsigned preview lane cannot build main"
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" == "main" || "$GITHUB_REF_NAME" == refs/heads/main ]]; then
            echo "::error::Run the preview workflow from the preview branch, not main"
            exit 1
          fi
          if [[ "$PREVIEW_REF" == refs/tags/* || "$GITHUB_REF_TYPE" == tag ]]; then
            echo "::error::Unsigned previews cannot be tag-triggered"
            exit 1
          fi
          if [[ "$PREVIEW_TAG" == v* ]]; then
            echo "::error::Preview release tags must never use the production v* namespace"
            exit 1
          fi
          echo "Unsigned preview source accepted: $PREVIEW_REF"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event_name == 'push' && github.sha || format('refs/heads/{0}', env.PREVIEW_REF) }}
          persist-credentials: false
          clean: true
      - name: Pin the selected preview commit
        id: pin-source
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build unsigned preview source and Python assets
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.preview-assets.outputs.artifact-id }}
    env:
      PREVIEW_SHA: ${{ needs.guard.outputs.source-sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.PREVIEW_SHA }}
          persist-credentials: false
          clean: true
      - name: Verify the pinned build commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$PREVIEW_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install release build tools
        run: python -m pip install --constraint requirements-release.txt pip setuptools wheel build ".[desktop,security,package]"
      - name: Build source and Python assets
        run: python scripts/make_release.py
      - name: Validate source and Python assets
        shell: bash
        run: |
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python scripts/check_release_publish_assets.py \
            --assets-dir dist \
            --tag "v${project_version}" \
            --source-assets-only
      - name: Mark artifacts as unsigned preview
        shell: bash
        run: |
          mkdir -p preview-dist
          for asset in dist/*; do
            cp "$asset" "preview-dist/unsigned-preview-$(basename "$asset")"
          done
          cat > preview-dist/UNSIGNED_PREVIEW.txt <<EOF
          UNSIGNED PREVIEW ARTIFACTS

          Branch: ${PREVIEW_REF}
          Commit: ${PREVIEW_SHA}
          Release tag: ${PREVIEW_TAG}

          These files were built without production signing or notarization.
          They are for review and testing only and must not be treated as trusted
          production artifacts. Production releases use release.yml, protected
          default-branch promotion, verified commits and signing credentials.
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: preview-assets
        with:
          name: unsigned-preview-source-python-${{ github.run_id }}-${{ github.run_attempt }}
          path: preview-dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish unsigned preview prerelease
    needs: [guard, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_SHA: ${{ needs.guard.outputs.source-sha }}
    steps:
      - name: Require the exact build artifact ID
        shell: bash
        env:
          PREVIEW_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        run: '[[ "$PREVIEW_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: preview-dist
      - name: Write preview release notes
        shell: bash
        run: |
          cat > preview-notes.md <<EOF
          # UNSIGNED PREVIEW

          This prerelease was built from **${PREVIEW_REF}** at **${PREVIEW_SHA}**.

          It is intentionally unsigned and is provided for branch review and
          smoke testing only. It is not a production release, has no production
          attestation, and must not be used as trusted installer media.

          Production releases remain gated by the protected default branch,
          verified commits, required review, and platform signing credentials.
          EOF
      - name: Publish verified preview draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PREVIEW_TAG" =~ ^unsigned-preview-[0-9]+$ && "$PREVIEW_TAG" == "unsigned-preview-$GITHUB_RUN_ID" ]]
          [[ "$PREVIEW_SHA" =~ ^[0-9a-f]{40}$ ]]
          api="repos/$GITHUB_REPOSITORY"
          request="$RUNNER_TEMP/preview-draft-request.json"
          inventory="$RUNNER_TEMP/preview-inventory.json"
          snapshot="$RUNNER_TEMP/preview-release.json"
          tag_ref="refs/tags/$PREVIEW_TAG"

          shopt -s nullglob
          assets=(preview-dist/*)
          test -f preview-dist/UNSIGNED_PREVIEW.txt
          for asset in "${assets[@]}"; do
            test -f "$asset" && test ! -L "$asset" || exit 1
            name="${asset##*/}"
            [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]
            size="$(stat -c '%s' -- "$asset")"
            digest="$(sha256sum -- "$asset" | cut -d' ' -f1)"
            jq -n --arg name "$name" --argjson size "$size" --arg digest "sha256:$digest" \
              '{name: $name, size: $size, digest: $digest}'
          done > "$RUNNER_TEMP/preview-inventory-entries.jsonl"
          jq -es 'sort_by(.name) | select(length > 0 and (map(.name | ascii_downcase) | unique | length) == length)' \
            "$RUNNER_TEMP/preview-inventory-entries.jsonl" > "$inventory"

          require_unused_tag() {
            gh api "$api/git/matching-refs/tags/$PREVIEW_TAG" | jq -e --arg ref "$tag_ref" \
              'type == "array" and all(.[]; (.ref | type) == "string" and .ref != $ref)' > /dev/null
          }

          verify_identity() {
            jq -e --slurpfile request "$request" --argjson id "$release_id" --argjson draft "$1" \
              '.id == $id and .draft == $draft and .prerelease == true and
               ({tag_name, target_commitish, name, body} == ($request[0] | {tag_name, target_commitish, name, body}))' \
              "$snapshot" > /dev/null
          }

          verify_release() {
            gh api "$api/releases/$release_id" > "$snapshot"
            verify_identity "$1"
            jq -e --slurpfile expected "$inventory" \
              '.assets | type == "array" and all(.[]; .state == "uploaded" and (.id | type == "number" and . > 0)) and
               (map({name, size, digest}) | sort_by(.name)) == $expected[0]' "$snapshot" > /dev/null
          }

          report_failed_release() {
            if [[ "$1" != 0 ]]; then
              echo "::warning::Inspect preview release $release_id ($PREVIEW_TAG) after the failed publication attempt"
            fi
          }

          require_unused_tag
          gh api --paginate --slurp "$api/releases?per_page=100" | jq -e --arg tag "$PREVIEW_TAG" \
            'type == "array" and length > 0 and all(.[]; type == "array" and all(.[]; (.tag_name | type) == "string" and .tag_name != $tag))' > /dev/null
          marker="<!-- remote-ops-branch-preview:$PREVIEW_TAG:$PREVIEW_SHA:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT -->"
          jq -n --arg tag "$PREVIEW_TAG" --arg sha "$PREVIEW_SHA" --arg marker "$marker" --rawfile notes preview-notes.md \
            '{tag_name: $tag, target_commitish: $sha, name: ($tag + " (UNSIGNED PREVIEW)"), body: ($notes + "\n" + $marker + "\n"), draft: true, prerelease: true}' > "$request"
          gh api --method POST "$api/releases" --input "$request" > "$snapshot"
          release_id="$(jq -er '.id | select(type == "number") | tostring | select(test("^[1-9][0-9]*$"))' "$snapshot")"
          trap 'report_failed_release "$?"' EXIT
          verify_identity true
          upload_url="$(jq -er '.upload_url | sub("\\{.*$"; "")' "$snapshot")"
          test "$upload_url" = "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets"

          for asset in "${assets[@]}"; do
            encoded_name="$(jq -rn --arg name "${asset##*/}" '$name | @uri')"
            status="$(curl --silent --show-error --output "$RUNNER_TEMP/preview-upload.json" --write-out '%{http_code}' \
              --request POST --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header 'Content-Type: application/octet-stream' --data-binary "@$asset" "$upload_url?name=$encoded_name")"
            test "$status" = 201
          done

          verify_release true
          require_unused_tag
          gh api --method PATCH "$api/releases/$release_id" --field draft=false --silent
          verify_release false
          gh api "$api/git/ref/tags/$PREVIEW_TAG" | jq -e --arg ref "$tag_ref" --arg sha "$PREVIEW_SHA" \
            '.ref == $ref and .object.type == "commit" and .object.sha == $sha' > /dev/null
          echo "Published and verified $PREVIEW_TAG at $PREVIEW_SHA"
