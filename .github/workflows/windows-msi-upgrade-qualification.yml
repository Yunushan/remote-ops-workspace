name: Signed Windows MSI upgrade qualification

on:
  workflow_dispatch:
    inputs:
      previous_tag:
        description: Previous certified release tag
        required: true
        type: string
      previous_sha:
        description: Full commit SHA for the previous release
        required: true
        type: string
      candidate_tag:
        description: Newer certified release tag
        required: true
        type: string
      candidate_sha:
        description: Full commit SHA for the newer release
        required: true
        type: string

permissions:
  contents: read
  attestations: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  signed-windows-upgrade:
    if: github.repository == 'Yunushan/remote-ops-workspace' && github.ref == 'refs/heads/main'
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          architecture: x64
          python-version: "3.14.7"
      - name: Cancel and retry the signed MSI upgrade
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ROW_PREVIOUS_TAG: ${{ inputs.previous_tag }}
          ROW_PREVIOUS_SHA: ${{ inputs.previous_sha }}
          ROW_CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          ROW_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          python -I scripts/qualify_windows_msi_upgrade.py `
            --previous-tag "$env:ROW_PREVIOUS_TAG" --previous-sha "$env:ROW_PREVIOUS_SHA" `
            --candidate-tag "$env:ROW_CANDIDATE_TAG" --candidate-sha "$env:ROW_CANDIDATE_SHA"
          exit $LASTEXITCODE
      - name: Retain bounded Windows install and rollback observations
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-windows-msi-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/native-smoke/windows-x64/signed-msi-upgrade.json
          if-no-files-found: warn
          retention-days: 90
