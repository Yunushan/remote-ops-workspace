          import time
          from pathlib import Path

          PINS = {'browser_probe.py': {'bytes': 27474, 'sha256': '94fa7d8928aa02a5c4b080e47a81b79bd3d1df1ffeb12753fdd19d82ba9fc401'}, 'cft_bundle.py': {'bytes': 53930, 'sha256': 'f8cf90a63132888858c5e5a9a75f5152bfb29c408c168e69155352b95271ea00'}, 'cft_git_config.py': {'bytes': 13828, 'sha256': 'deada9891fc83ed2ebb2a65daf050bf578aa8bc706fe2279634d6df26a0c8ef1'}, 'cft_git_owner.py': {'bytes': 8735, 'sha256': '197fd07633249a9020695db9563a930b266fd3713510f0919ba80b454099351d'}, 'cft_runtime.py': {'bytes': 42279, 'sha256': 'dee7fd5248851c7192c130252166d16c7da9f508546bd0416db99bef2066e5a9'}, 'gate_contract.py': {'bytes': 20044, 'sha256': '1809fd176f2f602022e8930a2ebc0a5e4449824426ed2dad2f415b33d939d52b'}, 'host_controller.py': {'bytes': 59794, 'sha256': '680aa42dab937f9479ebc6a9547b86b4e2e9451812c68e065cc0c91d6801c7d8'}, 'cft-runtime-policy.json': {'bytes': 1400, 'sha256': '1ca6ac144a8b45673cb1630e782a60ec7e396122db2c2c63a82118952cb0108f'}}
          started = time.monotonic()
