name: Android public toolchain qualification
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'tests/mobile-browser/qualify_android_stack.py'
      - 'tests/mobile-browser/hosted_controller.py'
      - 'tests/mobile-browser/observe_public_stack.py'
      - 'tests/mobile-browser/archive_readers_frozen.py'
      - '.github/workflows/android-toolchain-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify-public-stack:
    if: >-
      github.repository == 'Yunushan/remote-ops-workspace' &&
      github.event.repository.private == false &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.base.ref == 'main') ||
       (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/')))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ROW_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14.7'
      - name: Observe official public NPM bytes without executing the package
        id: observe
        run: |
          mkdir -p build/mobile-browser .tmp
          python tests/mobile-browser/qualify_android_stack.py guard
          python tests/mobile-browser/qualify_android_stack.py observe-public
      - name: Retain public NPM qualification even if a later SDK stage refuses
        if: ${{ always() && steps.observe.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Android-public-NPM-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/mobile-browser/android-public-stack-observation.json
          if-no-files-found: error
          retention-days: 14
      - name: Observe original hosted SDK tooling before copying it
        run: python tests/mobile-browser/qualify_android_stack.py bootstrap
      - name: Provision only the fresh isolated official API36 SDK
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          python tests/mobile-browser/qualify_android_stack.py guard
          owned_sdk="$RUNNER_TEMP/row-browser-api36-sdk"
          bootstrap_sdk="$RUNNER_TEMP/row-browser-api36-bootstrap"
          test ! -e "$owned_sdk"
          test ! -e "$bootstrap_sdk"
          mkdir -m 700 "$owned_sdk"
          mkdir -m 700 "$bootstrap_sdk"
          mkdir -m 700 "$bootstrap_sdk/cmdline-tools"
          cp -R "$ANDROID_HOME/cmdline-tools/latest" "$bootstrap_sdk/cmdline-tools/latest"
          cp -R "$ANDROID_HOME/licenses" "$owned_sdk/licenses"
          python tests/mobile-browser/qualify_android_stack.py guard-clone
          env -i PATH="$PATH" JAVA_HOME="$JAVA_HOME" HOME="$RUNNER_TEMP" LANG=C.UTF-8 \
            "$bootstrap_sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$owned_sdk" --install \
            'cmdline-tools;latest' 'platform-tools' 'emulator' 'platforms;android-36' 'system-images;android-36;google_apis;x86_64'
          printf '%s\n' 'phase=isolated-sdkmanager-zero-exit'
          # Initialize the vendor cache before capture pins the entire owned SDK.
          repository_home="$RUNNER_TEMP/row-browser-api36-repository-home"
          test ! -e "$repository_home"
          test ! -L "$repository_home"
          mkdir -m 700 "$repository_home"
          if ! timeout --signal=TERM --kill-after=5s 120s env -i \
            PATH="$PATH" JAVA_HOME="$JAVA_HOME" HOME="$repository_home" LANG=C.UTF-8 \
            ANDROID_HOME="$owned_sdk" ANDROID_SDK_ROOT="$owned_sdk" \
            ANDROID_USER_HOME="$repository_home" ANDROID_AVD_HOME="$repository_home/avd" \
            "$owned_sdk/cmdline-tools/latest/bin/avdmanager" list target >/dev/null 2>&1; then
            printf '%s\n' 'isolated-sdk-repository-initialization-refused' >&2
            exit 1
          fi
          test -f "$owned_sdk/.knownPackages"
          test ! -L "$owned_sdk/.knownPackages"
          test "$(stat -c '%u:%h:%s' -- "$owned_sdk/.knownPackages")" = "$(id -u):1:16"
          printf '%s\n' 'phase=isolated-sdk-repository-initialized'
          echo "ANDROID_HOME=$owned_sdk" >> "$GITHUB_ENV"
      - name: Enable KVM only for this disposable runner user
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          test -c /dev/kvm
          test ! -L /dev/kvm
          test "$(stat -c '%u:%h:%t:%T' /dev/kvm)" = '0:1:a:e8'
          test "$(stat -c '%a' /dev/kvm)" = '660'
          runner_uid="$(id -u)"
          test "$runner_uid" -gt 0
          device_identity="$(stat -c '%d:%i:%u:%g:%h:%f:%r' /dev/kvm)"
          acl_before="$(timeout 10s getfacl --absolute-names --numeric --omit-header -- /dev/kvm)"
          test "${#acl_before}" -le 8192
          other_acl_before="$(printf '%s\n' "$acl_before" | sed -E "/^user:$runner_uid:/d; /^mask::rw-$/d")"
          # Preserve the rw mask and every other trustee's effective rights.
          sudo --non-interactive setfacl --no-mask --modify "u:$runner_uid:rw" -- /dev/kvm
          test "$(stat -c '%d:%i:%u:%g:%h:%f:%r' /dev/kvm)" = "$device_identity"
          acl_after="$(timeout 10s getfacl --absolute-names --numeric --omit-header -- /dev/kvm)"
          test "${#acl_after}" -le 8192
          other_acl_after="$(printf '%s\n' "$acl_after" | sed -E "/^user:$runner_uid:/d; /^mask::rw-$/d")"
          test "$other_acl_after" = "$other_acl_before"
      - name: Observe actual KVM access before emulator capture
        shell: bash
        run: |
          set -euo pipefail
          # The collector is read-only; the separate setup step grants access.
          python tests/mobile-browser/qualify_android_stack.py guard
          python tests/mobile-browser/qualify_android_stack.py kvm-preflight
          printf '%s\n' 'phase=owned-host-kvm-access'
          if ! test -r /dev/kvm; then
            printf '%s\n' 'android-kvm-read-access-refused' >&2
            exit 1
          fi
          if ! test -w /dev/kvm; then
            printf '%s\n' 'android-kvm-write-access-refused' >&2
            exit 1
          fi
          printf '%s\n' 'phase=owned-host-kvm-read-write-observed'
      - name: Observe owned emulator package identities without starting Chrome
        id: capture
        run: python tests/mobile-browser/qualify_android_stack.py capture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() && steps.capture.outputs.public_receipt == 'saved' }}
        with:
          name: Android-public-toolchain-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/mobile-browser/android-toolchain-qualification.json
          if-no-files-found: error
          retention-days: 14
