name: PyQt6 forward compatibility

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: pyqt6-forward-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  pyqt6-forward-compatibility:
    name: PyQt6 6.12 forward compatibility on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            qt_platform: "offscreen"
          - os: windows-2025-vs2026
            qt_platform: "windows"
          - os: macos-15-intel
            qt_platform: "offscreen"
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      QT_QPA_PLATFORM: ${{ matrix.qt_platform }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fontconfig \
            fonts-dejavu-core \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxext6 \
            libxrender1
          fc-cache -f
      - name: Install GUI verification dependencies
        run: python -m pip install -e ".[security,package,dev]"
      - name: Install the latest PyQt6 and Qt 6.12 wheels
        run: >-
          python -m pip install --upgrade --upgrade-strategy eager --pre
          "PyQt6>=6.12.0,<6.13.0" "PyQt6-Qt6>=6.12.0,<6.13.0"
          --only-binary=:all:
          --index-url https://pypi.org/simple/
          --extra-index-url https://www.riverbankcomputing.com/pypi/simple/
      - name: Verify PyQt6 6.12 forward-compatibility contract
        run: >-
          python scripts/check_pyqt6_compatibility.py --require-pyqt6
          --target-version 6.12.0 --require-target --require-forward-binding
      - name: Render all GUI presets with the forward-compatibility runtime
        timeout-minutes: 10
        run: >-
          python scripts/check_real_gui_render.py --require-pyqt6 --timeout-seconds 300
          --out-dir artifacts/pyqt6-forward-render
      - name: Validate forward-compatibility GUI render evidence
        timeout-minutes: 2
        run: python scripts/check_real_gui_render_artifact.py --artifact-dir artifacts/pyqt6-forward-render
      - name: Exercise all GUI controls with the forward-compatibility runtime
        timeout-minutes: 10
        run: >-
          python scripts/check_gui_interactions.py --require-pyqt6
          --out-dir artifacts/pyqt6-forward-interactions
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: pyqt6-forward-compatibility-${{ matrix.os }}
          path: artifacts/pyqt6-forward-*
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30
