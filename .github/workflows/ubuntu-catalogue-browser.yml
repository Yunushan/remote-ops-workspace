name: Ubuntu real catalogue browser qualification

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ubuntu-real-catalogue-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  actual-catalogue-browser:
    if: >-
      github.repository == 'Yunushan/remote-ops-workspace' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      QUALIFICATION_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      # Retrieve event/workflow Git objects as well as the exact candidate head.
      # No repository credentials persist into product/browser children.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select exact candidate source locally
        shell: bash
        run: |
          test "$QUALIFICATION_SOURCE_SHA" != ""
          /usr/bin/git -c core.hooksPath=/dev/null checkout --detach "$QUALIFICATION_SOURCE_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14.7'
          architecture: x64
      - name: Prepare exact pinned browser pair on this disposable host
        shell: bash
        run: |
          set -euo pipefail
          sudo --non-interactive -- /usr/bin/env -i \
            PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            ImageOS="$ImageOS" \
            ImageVersion="$ImageVersion" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_SHA="$GITHUB_SHA" \
            QUALIFICATION_SOURCE_SHA="$QUALIFICATION_SOURCE_SHA" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" \
            GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
            ROW_CFT_ACTION=prepare \
            /usr/bin/python3 -I -S -B - <<'ROW_CFT_ROOT_PY'
          import hashlib
          import json
          import os
          import platform
          import pwd
          import re
          import secrets
          import stat
          import sys
          import time
          from pathlib import Path

          PINS = {'browser_probe.py': {'bytes': 27474, 'sha256': '94fa7d8928aa02a5c4b080e47a81b79bd3d1df1ffeb12753fdd19d82ba9fc401'}, 'cft_bundle.py': {'bytes': 53930, 'sha256': 'f8cf90a63132888858c5e5a9a75f5152bfb29c408c168e69155352b95271ea00'}, 'cft_git_config.py': {'bytes': 13828, 'sha256': 'deada9891fc83ed2ebb2a65daf050bf578aa8bc706fe2279634d6df26a0c8ef1'}, 'cft_git_owner.py': {'bytes': 8735, 'sha256': '197fd07633249a9020695db9563a930b266fd3713510f0919ba80b454099351d'}, 'cft_runtime.py': {'bytes': 42279, 'sha256': 'dee7fd5248851c7192c130252166d16c7da9f508546bd0416db99bef2066e5a9'}, 'gate_contract.py': {'bytes': 20044, 'sha256': '1809fd176f2f602022e8930a2ebc0a5e4449824426ed2dad2f415b33d939d52b'}, 'host_controller.py': {'bytes': 59794, 'sha256': '680aa42dab937f9479ebc6a9547b86b4e2e9451812c68e065cc0c91d6801c7d8'}, 'cft-runtime-policy.json': {'bytes': 1400, 'sha256': '1ca6ac144a8b45673cb1630e782a60ec7e396122db2c2c63a82118952cb0108f'}}
          started = time.monotonic()
          deadline = started + 150
          phase = 'bootstrap'


          BOOTSTRAP_CODES = ('check-refused', 'operation-exception', 'json-nonfinite', 'diagnostic-bound', 'deadline', 'input-file-policy', 'descriptor-before', 'input-overflow', 'descriptor-after-length', 'input-path-readback', 'json-duplicate-key', 'system-platform', 'root-isolated-startup', 'system-interpreter-path', 'system-interpreter-elf', 'runner-account', 'host-image-context', 'os-release-context', 'workspace-path', 'workspace-directory-policy', 'workspace-ancestor-directory', 'source-head-format', 'event-repository', 'event-pull-request', 'event-push', 'run-identifiers', 'workflow-context', 'root-base-policy', 'write-progress', 'stage-byte-readback', 'source-recipe-shape', 'source-bytes-pin', 'stage-parent-descriptor', 'stage-child-descriptor', 'stage-seal-identity', 'stage-parent-readback')
          BOOTSTRAP_PHASES = ('bootstrap', 'system-context', 'interpreter', 'runner-account', 'host-context', 'os-release', 'workspace', 'event', 'run-context', 'root-bases', 'source-checks', 'stage-birth', 'stage-write', 'stage-seal', 'stage-readback', 'stage-cleanup', 'exec')


          class BootstrapRefusal(RuntimeError):
              pass


          def need(value, code='check-refused'):
              if not value:
                  raise BootstrapRefusal(code)


          def bootstrap_diagnostic(error, phase):
              code = 'operation-exception'
              if type(error) is BootstrapRefusal:
                  args = error.args
                  if type(args) is tuple and len(args) == 1 and type(args[0]) is str and args[0] in BOOTSTRAP_CODES:
                      code = args[0]
              if type(phase) is not str or phase not in BOOTSTRAP_PHASES:
                  phase = 'bootstrap'
              raw = json.dumps({'schema': 'row.cft-root-bootstrap-diagnostic.v1', 'status': 'refused',
                  'phase': phase, 'code': code, 'readiness_credit': 0}, sort_keys=True,
                  separators=(',', ':'), ensure_ascii=True).encode('ascii')
              if len(raw) > 512:
                  return b'{"schema":"row.cft-root-bootstrap-diagnostic.v1","status":"refused","phase":"bootstrap","code":"diagnostic-bound","readiness_credit":0}'
              return raw


          def emit_bootstrap_diagnostic(error, phase, stream):
              try:
                  raw = bootstrap_diagnostic(error, phase)
                  stream.write('cft-root-bootstrap-diagnostic ' + raw.decode('ascii') + '\n')
                  stream.flush()
              except BaseException:
                  pass


          def clock():
              need(time.monotonic() < deadline, 'deadline')


          def identity(info):
              return (info.st_dev, info.st_ino, info.st_mode, info.st_uid, info.st_gid,
                  info.st_nlink, info.st_size, info.st_mtime_ns, info.st_ctime_ns)


          def raw_read(path, maximum, owners):
              clock()
              before = path.lstat()
              need(stat.S_ISREG(before.st_mode) and before.st_nlink == 1
                  and before.st_uid in owners and not before.st_mode & 0o022
                  and 0 < before.st_size <= maximum, 'input-file-policy')
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              try:
                  need(identity(os.fstat(fd)) == identity(before), 'descriptor-before')
                  data = bytearray()
                  while True:
                      clock()
                      chunk = os.read(fd, min(65536, maximum + 1 - len(data)))
                      if not chunk:
                          break
                      need(len(data) + len(chunk) <= maximum, 'input-overflow')
                      data.extend(chunk)
                  need(len(data) == before.st_size and identity(os.fstat(fd)) == identity(before), 'descriptor-after-length')
                  answer = bytes(data)
              finally:
                  os.close(fd)
              need(identity(path.lstat()) == identity(before), 'input-path-readback')
              clock()
              return answer


          def unique(rows):
              answer = {}
              for key, value in rows:
                  need(key not in answer, 'json-duplicate-key')
                  answer[key] = value
              return answer


          def nonfinite(_value):
              raise BootstrapRefusal('json-nonfinite')


          def json_data(raw):
              return json.loads(raw.decode('utf-8'), object_pairs_hook=unique, parse_constant=nonfinite)


          def validate_context():
              global phase
              phase = 'system-context'
              need(sys.platform == 'linux' and platform.machine() == 'x86_64'
                  and platform.python_version_tuple()[:2] == ('3', '12'), 'system-platform')
              need(os.getuid() == os.geteuid() == 0 and os.getgid() == os.getegid() == 0 and sys.flags.isolated == 1
                  and sys.flags.no_site == 1 and sys.dont_write_bytecode, 'root-isolated-startup')
              phase = 'interpreter'
              python = Path(sys.executable).resolve(strict=True)
              need(python == Path('/usr/bin/python3.12'), 'system-interpreter-path')
              need(raw_read(python, 536870912, {0})[:4] == b'\x7fELF', 'system-interpreter-elf')
              phase = 'runner-account'
              account = pwd.getpwnam('runner')
              need(account.pw_name == 'runner' and account.pw_uid > 0 and account.pw_gid > 0
                  and account.pw_dir == '/home/runner', 'runner-account')
              phase = 'host-context'
              env = os.environ
              need(env.get('GITHUB_ACTIONS') == 'true' and env.get('RUNNER_ENVIRONMENT') == 'github-hosted'
                  and env.get('GITHUB_REPOSITORY') == 'Yunushan/remote-ops-workspace'
                  and env.get('ImageOS') == 'ubuntu24' and re.fullmatch(r'[0-9.]{1,64}', env.get('ImageVersion', '')), 'host-image-context')
              phase = 'os-release'
              release = raw_read(Path('/etc/os-release').resolve(strict=True), 4096, {0})
              need(re.search(rb'^ID=ubuntu$', release, re.MULTILINE)
                  and re.search(rb'^VERSION_ID="24\.04"$', release, re.MULTILINE), 'os-release-context')
              phase = 'workspace'
              repo = Path(env['GITHUB_WORKSPACE'])
              need(str(repo) == '/home/runner/work/remote-ops-workspace/remote-ops-workspace', 'workspace-path')
              for directory in (repo, repo / 'tests', repo / 'tests' / 'catalogue-browser'):
                  info = directory.lstat()
                  need(stat.S_ISDIR(info.st_mode) and info.st_uid == account.pw_uid
                      and info.st_gid == account.pw_gid and not info.st_mode & 0o022, 'workspace-directory-policy')
              for directory in repo.parents:
                  need(stat.S_ISDIR(directory.lstat().st_mode), 'workspace-ancestor-directory')
              source, event_sha = env.get('QUALIFICATION_SOURCE_SHA', ''), env.get('GITHUB_SHA', '')
              need(re.fullmatch(r'[0-9a-f]{40}', source) and re.fullmatch(r'[0-9a-f]{40}', event_sha), 'source-head-format')
              phase = 'event'
              event = json_data(raw_read(Path(env['GITHUB_EVENT_PATH']), 1048576, {0, account.pw_uid}))
              need(event['repository']['full_name'] == 'Yunushan/remote-ops-workspace'
                  and event['repository']['private'] is False, 'event-repository')
              if env.get('GITHUB_EVENT_NAME') == 'pull_request':
                  pr = event['pull_request']
                  need(pr['head']['repo']['full_name'] == 'Yunushan/remote-ops-workspace'
                      and pr['head']['sha'] == source and pr['base']['ref'] == 'main'
                      and event['action'] in ('opened', 'reopened', 'synchronize'), 'event-pull-request')
              else:
                  need(env.get('GITHUB_EVENT_NAME') == 'push' and event['ref'] == 'refs/heads/main'
                      and event['after'] == source == event_sha, 'event-push')
              phase = 'run-context'
              for key in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT'):
                  need(re.fullmatch(r'[1-9][0-9]{0,19}', env.get(key, '')), 'run-identifiers')
              workflow = '.github/workflows/ubuntu-catalogue-browser.yml'
              need(re.fullmatch(r'[0-9a-f]{40}', env.get('GITHUB_WORKFLOW_SHA', ''))
                  and env.get('GITHUB_WORKFLOW_REF', '').startswith('Yunushan/remote-ops-workspace/' + workflow + '@'), 'workflow-context')
              phase = 'root-bases'
              for directory in (Path('/'), Path('/var'), Path('/var/lib')):
                  info = directory.lstat()
                  need(stat.S_ISDIR(info.st_mode) and info.st_uid == 0 and not info.st_mode & 0o022, 'root-base-policy')
              return repo, account.pw_uid


          def write_source(path, raw):
              clock()
              fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
              try:
                  remaining = memoryview(raw)
                  while remaining:
                      clock()
                      count = os.write(fd, remaining)
                      need(count > 0, 'write-progress')
                      remaining = remaining[count:]
                  os.fsync(fd)
                  os.fchmod(fd, 0o444)
              finally:
                  os.close(fd)
              need(raw_read(path, 1048576, {0}) == raw, 'stage-byte-readback')


          def main():
              global phase
              repo, uid = validate_context()
              directory = repo / 'tests' / 'catalogue-browser'
              phase = 'source-checks'
              source = {}
              for name, pin in PINS.items():
                  need(re.fullmatch(r'[a-z_-]+\.(?:py|json)', name) and set(pin) == {'bytes', 'sha256'}, 'source-recipe-shape')
                  data = raw_read(directory / name, 1048576, {uid})
                  need(len(data) == pin['bytes'] and hashlib.sha256(data).hexdigest() == pin['sha256'], 'source-bytes-pin')
                  source[name] = data
              root = Path('/var/lib') / ('row-cft-source-' + secrets.token_hex(16))
              phase = 'stage-birth'
              parent_fd = None
              stage_fd = None
              try:
                  parent_fd = os.open('/var/lib', os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
                  parent_before = Path('/var/lib').lstat()
                  need(identity(os.fstat(parent_fd)) == identity(parent_before), 'stage-parent-descriptor')
                  os.mkdir(root.name, mode=0o700, dir_fd=parent_fd)
                  stage_fd = os.open(root.name, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=parent_fd)
                  need(identity(os.fstat(stage_fd)) == identity(root.lstat()), 'stage-child-descriptor')
                  phase = 'stage-write'
                  for name, data in source.items():
                      write_source(root / name, data)
                  capsule = json.dumps({'source_directory': str(directory), 'pins': PINS},
                      sort_keys=True, separators=(',', ':'), ensure_ascii=True).encode('ascii')
                  write_source(root / 'stage.json', capsule)
                  phase = 'stage-seal'
                  os.fchmod(stage_fd, 0o555)
                  need(identity(os.fstat(stage_fd)) == identity(root.lstat()), 'stage-seal-identity')
                  phase = 'stage-readback'
                  current_parent = Path('/var/lib').lstat()
                  need(current_parent.st_uid == 0 and not current_parent.st_mode & 0o022
                      and (current_parent.st_dev, current_parent.st_ino) == (parent_before.st_dev, parent_before.st_ino), 'stage-parent-readback')
              finally:
                  first = None
                  for fd in (stage_fd, parent_fd):
                      if fd is not None:
                          try:
                              os.close(fd)
                          except BaseException as error:
                              if first is None:
                                  phase = 'stage-cleanup'
                                  first = error
                  if first is not None:
                      raise first
              clock()
              env = dict(os.environ)
              env['ROW_CFT_PREP_DEADLINE'] = repr(deadline)
              # The only inserted import directory is the exact root-staged pinned tree.
              loader = 'import runpy,sys;sys.path.insert(0,' + repr(str(root)) + ');runpy.run_path(' + repr(str(root / 'cft_runtime.py')) + ',run_name="__main__")'
              phase = 'exec'
              os.execve('/usr/bin/python3.12', ['/usr/bin/python3.12', '-I', '-S', '-B', '-c', loader], env)


          try:
              main()
          except BaseException as error:
              emit_bootstrap_diagnostic(error, phase, sys.stderr)
              try:
                  sys.stderr.write('cft-root-bootstrap-refused\n')
              except BaseException:
                  pass
              raise SystemExit(1) from None
          ROW_CFT_ROOT_PY
      - name: Observe actual browser and catalogue cases
        shell: bash
        run: python -I -S -B tests/catalogue-browser/entry.py run
      - name: Remove the exact same-run host userns profile
        id: host-policy-cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sudo --non-interactive -- /usr/bin/env -i \
            PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            ImageOS="$ImageOS" \
            ImageVersion="$ImageVersion" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_SHA="$GITHUB_SHA" \
            QUALIFICATION_SOURCE_SHA="$QUALIFICATION_SOURCE_SHA" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" \
            GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
            ROW_CFT_ACTION=cleanup \
            /usr/bin/python3 -I -S -B - <<'ROW_CFT_CLEANUP_ROOT_PY'
