name: Timed macro replay release evidence

on:
  workflow_dispatch:
    inputs:
      candidate_inventory:
        description: Optional sealed candidate coordinates as RUN_ID ARTIFACT_ID sha256:DIGEST
        required: false
        type: string

permissions:
  actions: read
  attestations: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  MACRO_IMAGE: row-macro-release-evidence:local

jobs:
  qualify-macro:
    name: Qualify saved macro playback in the release wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require an exact release tag
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = tag
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF" = "refs/tags/$GITHUB_REF_NAME"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'MACRO_WORK=%s/macro-replay-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - name: Verify the exact wheel from the release or sealed inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROW_QUALIFICATION_CANDIDATE_INVENTORY: ${{ inputs.candidate_inventory }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$MACRO_WORK/release" "$MACRO_WORK/review"
          python -I scripts/fetch_qualification_release_asset.py --kind wheel --directory "$MACRO_WORK/release" \
            --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --sha "$GITHUB_SHA"
      - name: Prepare a hash-locked Qt and OpenSSH fixture
        shell: bash
        run: bash scripts/build_qt_release_fixture.sh "$MACRO_WORK" "$MACRO_IMAGE"
      - name: Verify named recording, reopening and timed playback into the selected SSH session
        shell: bash
        run: |
          wheel="remote_ops_workspace-${GITHUB_REF_NAME#v}-py3-none-any.whl"
          evidence="$MACRO_WORK/review/macro-recorder"
          python scripts/run_qt_release_fixture.py \
            --capture macro --image "$MACRO_IMAGE" --wheel "$MACRO_WORK/release/$wheel" --out "$evidence"
          python scripts/make_mobaxterm_parity_evidence_record.py \
            --article-id macro-recorder --release-tag "$GITHUB_REF_NAME" --release-target linux-x86_64 \
            --evidence "$evidence/evidence.json" --assets-dir "$evidence" \
            --release-asset-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$wheel" \
            --artifact "$wheel=$MACRO_WORK/release/$wheel" --out "$MACRO_WORK/review/candidate.json"
      - name: Retain the candidate and exact timing evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macro-replay-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macro-replay-evidence/review/
          if-no-files-found: error
          retention-days: 30
